# 80x128 SSD1680/SSD1681-family e-paper through ZMK's IL0323 driver.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_SPI=y
CONFIG_IL0323=y

# The stock Corne shield enables its SSD1306 OLED whenever ZMK_DISPLAY is on.
# This adapter replaces that display and disables its I2C bus, so the driver
# must also be disabled to avoid creating a device on an unavailable bus.
CONFIG_SSD1306=n

CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_DPI_DEF=145
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_USE_THEME_MONO=y

# Start with ZMK's simple built-in status screen. This avoids coupling the
# electrical bring-up test to nice!view or Corne-ish Zen custom widgets.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
